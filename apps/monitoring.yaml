apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 68.2.1
    helm:
      releaseName: monitoring
      values: |
        grafana:
          enabled: true
          adminPassword: admin123
          service:
            type: NodePort
            nodePort: 32000

        prometheus:
          service:
            type: NodePort
            nodePort: 32001

        alertmanager:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true