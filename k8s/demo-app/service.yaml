apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
    - name: frontend
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: backend
      port: 5000
      targetPort: 5000
      nodePort: 30005